name: Build and publish a Docker image to ghcr.io

on:
  release:
    types: [published]
  push:
    branches:
      - main

jobs:
  docker_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=true
          tags: |
            # Release tag "vX.Y.Z" -> "X.Y.Z"
            type=semver,pattern={{version}}
            # Fallback SHA tag for any push
            type=sha,format=short,prefix=sha-,enable=true
            # (Optional) also keep the raw git tag (e.g., "v1.2.3")
            # type=ref,event=tag

      - name: Show computed tags (debug)
        run: |
          echo "TAGS:"
          echo "${{ steps.meta.outputs.tags }}"

      # Optional multi-arch:
      # - uses: docker/setup-qemu-action@v3
      # - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # platforms: linux/amd64,linux/arm64   # if you enabled Buildx/QEMU
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
