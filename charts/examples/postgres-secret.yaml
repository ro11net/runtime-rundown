# Example secret for external PostgreSQL database
# Create this secret before deploying with external database
---
apiVersion: v1
kind: Secret
metadata:
  name: prod-postgres-credentials
  namespace: runtime-rundown  # Change to your namespace
type: Opaque
stringData:
  host: "postgres.database.svc.cluster.local"
  port: "5432"
  database: "fluxtraining"
  username: "fluxapp"
  password: "super-secret-password"  # Use a strong password in production
---
# Example using kubectl command:
# kubectl create secret generic prod-postgres-credentials \
#   --from-literal=host=postgres.example.com \
#   --from-literal=port=5432 \
#   --from-literal=database=fluxdb \
#   --from-literal=username=fluxuser \
#   --from-literal=password='${DB_PASSWORD}' \
#   --namespace=flux-training