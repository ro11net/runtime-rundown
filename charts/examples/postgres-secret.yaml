# Example secret for external PostgreSQL database
# This demonstrates how to create a secret with different key names
# than the environment variables expected by the application
apiVersion: v1
kind: Secret
metadata:
  name: prod-postgres-credentials
  namespace: flux-training  # Change to your namespace
type: Opaque
stringData:
  # These keys can be named differently from the env vars
  # The mapping is handled in values.yaml under app.externalDatabase.secretKeys
  db_host: "postgres.database.svc.cluster.local"
  db_port: "5432"
  db_name: "fluxtraining"
  db_user: "fluxapp"
  db_password: "super-secret-password"  # Use a strong password in production
---
# Alternative example using standard keys
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials-standard
  namespace: flux-training
type: Opaque
stringData:
  hostname: "external-postgres.example.com"
  port: "5432"
  database: "production_db"
  username: "app_user"
  password: "another-secret-password"
