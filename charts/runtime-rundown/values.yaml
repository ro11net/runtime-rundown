# Default values for flux-training-app
replicaCount: 1

image:
  repository: ghcr.io/ro11net/runtime-rundown
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v0.1.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Application configuration
app:
  # Environment variables for the application
  env:
    SECURITY_LEVEL: "LOW"
    MESSAGE: "Welcome to the Runtime Rundown!"
  
  # External PostgreSQL configuration
  externalDatabase:
    # Enable external database (disables the included PostgreSQL chart)
    enabled: false
    # Secret containing database credentials
    # The secret should exist in the same namespace
    existingSecret: "postgres-credentials"
    # Secret key mappings - map secret keys to expected env vars
    secretKeys:
      host: "hostname"        # Key in secret for DB_HOST
      port: "port"           # Key in secret for DB_PORT
      database: "database"   # Key in secret for DB_NAME
      username: "username"   # Key in secret for DB_USER
      password: "password"   # Key in secret for DB_PASSWORD

# PostgreSQL chart configuration (when postgresql.enabled=true)
postgresql:
  enabled: true
  auth:
    postgresPassword: "postgres"
    username: "fluxuser"
    password: "fluxpass"
    database: "fluxdb"
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    # Security context for PostgreSQL
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
      seccompProfile:
        type: RuntimeDefault

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

# Pod security context (applies to all containers in the pod)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

# Container security context (applies to the main container)
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: flux-training.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: flux-training-tls
  #    hosts:
  #      - flux-training.local

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Volume mounts for the container
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /root/.cache

# Volumes for the pod
volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - flux-training-app
          topologyKey: kubernetes.io/hostname

# Network Policy
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Additional labels and annotations
podAnnotations: {}
podLabels: {}

# Priority class name
priorityClassName: ""

# Topology spread constraints
topologySpreadConstraints: []

# Init containers
initContainers: []

# Additional containers
extraContainers: []

# Extra environment variables
extraEnvVars: []

# Extra environment variables from secrets or configmaps
extraEnvVarsSecret: ""
extraEnvVarsConfigMap: ""
