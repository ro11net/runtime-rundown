# Default values for flux-training-app
replicaCount: 1

image:
  repository: ghcr.io/ro11net/runtime-rundown  # Update this to your actual repository
  pullPolicy: IfNotPresent
  tag: "0.3.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Application configuration
app:
  # Environment variables for the application
  env:
    SECURITY_LEVEL: "LOW"
    MESSAGE: "Welcome to Flux Training!"
  
  # Database configuration
  database:
    # If using external database, set the secret name here
    # Secret should contain: host, port, database, username, password
    existingSecret: ""
    # Or provide values directly (not recommended for production)
    host: "postgres"
    port: "5432"
    database: "fluxdb"
    username: "postgres"
    # Password should be provided via existingSecret in production
    password: "postgres"

# PostgreSQL deployment (optional simple PostgreSQL for dev/testing)
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "1Mi"
      cpu: "1m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""  # Leave empty to use default
  # Environment variables for PostgreSQL
  env:
    POSTGRES_DB: "fluxdb"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "postgres"  # Change this in production

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: flux-training.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    memory: "1Mi"
    cpu: "1m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# Health checks
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Additional labels and annotations
podAnnotations: {}
podLabels: {}