apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runtime-rundown.fullname" . }}
  labels:
    {{- include "runtime-rundown.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "runtime-rundown.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "runtime-rundown.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "runtime-rundown.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/runtime-rundown"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Application environment variables from values
            - name: SECURITY_LEVEL
              value: {{ .Values.app.env.SECURITY_LEVEL | quote }}
            - name: MESSAGE
              value: {{ .Values.app.env.MESSAGE | quote }}
            
            # Database configuration
            {{- if .Values.app.externalDatabase.enabled }}
            # External database configuration from secret
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.externalDatabase.existingSecret }}
                  key: {{ .Values.app.externalDatabase.secretKeys.host }}
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.externalDatabase.existingSecret }}
                  key: {{ .Values.app.externalDatabase.secretKeys.port }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.externalDatabase.existingSecret }}
                  key: {{ .Values.app.externalDatabase.secretKeys.database }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.externalDatabase.existingSecret }}
                  key: {{ .Values.app.externalDatabase.secretKeys.username }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.externalDatabase.existingSecret }}
                  key: {{ .Values.app.externalDatabase.secretKeys.password }}
            {{- else }}
            # Internal PostgreSQL database configuration
            - name: DB_HOST
              value: {{ include "runtime-rundown.postgresql.fullname" . | quote }}
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: DB_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "runtime-rundown.postgresql.secretName" . }}
                  key: password
            {{- end }}
            
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            
            {{- if .Values.extraEnvVarsConfigMap }}
            envFrom:
              - configMapRef:
                  name: {{ .Values.extraEnvVarsConfigMap }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
              - secretRef:
                  name: {{ .Values.extraEnvVarsSecret }}
            {{- end }}
          
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- toYaml .Values.volumes | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
