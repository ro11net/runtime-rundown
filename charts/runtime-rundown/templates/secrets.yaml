{{- if not .Values.app.database.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flux-training-app.fullname" . }}-db-secret
  labels:
    {{- include "flux-training-app.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.app.database.password | b64enc | quote }}
{{- end }}

{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flux-training-app.fullname" . }}-postgres-secret
  labels:
    {{- include "flux-training-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
data:
  postgres-password: {{ .Values.postgres.env.POSTGRES_PASSWORD | b64enc | quote }}
{{- end }}
